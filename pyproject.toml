[project]
name = "semantic-version-parser"
version = "0.1.0"
description = "Parses SemVer 2.0 version strings into major, minor, patch, prerelease, and build components."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
